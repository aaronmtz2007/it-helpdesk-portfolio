name: 02-osticket-helpdesk

# osTicket + MariaDB for the help desk lab.
# Usage:  copy .env.example .env   (set your own values)  ->  docker compose up -d
# The image installs osTicket by itself on first start using the variables below,
# so there is no web installer step. Portal: http://localhost:8080  Agents: http://localhost:8080/scp
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: osticket
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql

  osticket:
    image: campbellsoftwaresolutions/osticket:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: osticket
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${DB_PASSWORD}
      INSTALL_NAME: "Soporte TI Lab"
      INSTALL_EMAIL: soporte@lab.local
      INSTALL_URL: http://localhost:8080/
      INSTALL_SECRET: ${INSTALL_SECRET}
      ADMIN_FIRSTNAME: Aaron
      ADMIN_LASTNAME: Martinez
      ADMIN_EMAIL: admin@lab.local
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

volumes:
  dbdata:
